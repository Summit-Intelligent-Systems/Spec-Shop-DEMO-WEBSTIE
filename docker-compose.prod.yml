version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: xyz_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xyz_eyewear_db}
      POSTGRES_USER: ${POSTGRES_USER:-xyz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-xyz_user}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - xyz_network
    # Not exposed externally in production — access via internal network only

  redis:
    image: redis:7-alpine
    container_name: xyz_redis_prod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - xyz_network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: xyz_api_prod
    restart: always
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xyz_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: xyz_web_prod
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - xyz_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ─── Nginx Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: xyz_nginx_prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - web
      - api
    networks:
      - xyz_network

networks:
  xyz_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_cache:
