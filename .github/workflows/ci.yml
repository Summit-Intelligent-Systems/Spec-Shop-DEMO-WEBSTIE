name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://xyz_user:xyz_password@localhost:5432/xyz_test_db
  DIRECT_URL: postgresql://xyz_user:xyz_password@localhost:5432/xyz_test_db
  NODE_ENV: test

jobs:
  # ─── Lint & Type Check ────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run type-check

      - name: Check Prettier
        run: npm run format:check
        # The repository predates this workflow and contains existing
        # formatting drift. Keep the report visible without blocking deploys;
        # lint, type-check, tests, and the production build remain required.
        continue-on-error: true

  # ─── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xyz_test_db
          POSTGRES_USER: xyz_user
          POSTGRES_PASSWORD: xyz_password
        options: >-
          --health-cmd "pg_isready -U xyz_user -d xyz_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://xyz_user:xyz_password@localhost:5432/xyz_test_db
      DIRECT_URL: postgresql://xyz_user:xyz_password@localhost:5432/xyz_test_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_jwt_secret_at_least_32_characters_long
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_at_least_32_characters
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push DB schema
        run: npx prisma db push --accept-data-loss
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://xyz_user:xyz_password@localhost:5432/xyz_test_db
          DIRECT_URL: postgresql://xyz_user:xyz_password@localhost:5432/xyz_test_db

      - name: Run tests
        run: npm test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ─── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build
